name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-latest
            target: bun-linux-x64
            output_name: ai-commit-linux-amd64
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
            target: bun-linux-arm64
            output_name: ai-commit-linux-arm64
          - name: macos-amd64
            runs_on: macos-15-intel
            target: bun-darwin-x64
            output_name: ai-commit-macos-amd64
          - name: macos-arm64
            runs_on: macos-14
            target: bun-darwin-arm64
            output_name: ai-commit-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (20+)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} ./index.ts --outfile ./dist/${{ matrix.output_name }}
          chmod +x ./dist/${{ matrix.output_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ./dist/${{ matrix.output_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ai-commit-* > checksums.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ai-commit-*
            dist/checksums.txt

  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Sync package version with release tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Tag must start with 'v'. Got: $GITHUB_REF_NAME"
            exit 1
          fi

          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing version: $(npm pkg get version)"

      - name: Publish package to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
